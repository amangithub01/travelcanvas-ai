limit_req_zone $binary_remote_addr zone=planning:10m rate=10r/m;

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    send_timeout 15s;
    resolver 127.0.0.11 valid=10s ipv6=off;
    access_log off;
    error_log /dev/stderr warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location = /api/plan-trip {
        limit_req zone=planning burst=5 nodelay;
        limit_req_status 429;
        set $api http://api:8000;
        proxy_pass $api/plan-trip;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 115s;
        proxy_buffering off;
    }

    location /api/ {
        set $api http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
        proxy_buffering off;
    }

    location / {
        set $frontend http://frontend:3000;
        proxy_pass $frontend;
        proxy_set_header Host $http_host;
        proxy_read_timeout 30s;
    }
}
